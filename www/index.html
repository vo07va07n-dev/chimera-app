<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Chimera</title>
<style>
:root{--bg:#05070d;--cy:#00e5ff;--gd:#ffd166;--gr:#4ade80;--rd:#ff5470}*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}body{background:var(--bg);color:#fff;height:100vh;display:flex;flex-direction:column;overflow:hidden;user-select:none}header{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid #00e5ff22}.logo{color:var(--cy);font-weight:300;letter-spacing:5px;font-size:18px}.status-text{font-size:10px;color:var(--cy);opacity:.8;margin-top:2px;text-transform:uppercase;transition:color .3s}.status-text.waiting{color:var(--gd);animation:pulse 1s infinite}.header-right{display:flex;gap:8px;align-items:center}.test-btn{background:#222;border:1px solid var(--cy);color:var(--cy);padding:6px 12px;border-radius:8px;font-size:11px;cursor:pointer}.gear{cursor:pointer;font-size:22px}.orb-wrap{height:18vh;display:flex;justify-content:center;align-items:center;position:relative}.orb{width:90px;height:90px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#9df9ff,var(--cy) 30%,#006a80 70%,#001824);box-shadow:0 0 50px #00e5ff66;transition:.3s;cursor:pointer}.orb.active{background:radial-gradient(circle at 30% 30%,#fff1a8,var(--gd) 30%,#806000 70%);box-shadow:0 0 70px #ffd16688;transform:scale(1.1)}.orb.listening{animation:listeningPulse 1s infinite}.orb.thinking{animation:spin 1.5s linear infinite;border:3px dashed var(--cy);background:transparent;box-shadow:none}.orb.waiting-timer{border:2px solid var(--gd);box-shadow:0 0 40px var(--gd);animation:pulse 1s infinite}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{opacity:.5}}@keyframes listeningPulse{0%{transform:scale(1);box-shadow:0 0 50px var(--cy)}50%{transform:scale(1.15);box-shadow:0 0 80px var(--cy)}100%{transform:scale(1);box-shadow:0 0 50px var(--cy)}}#chat{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:6px;scroll-behavior:smooth}.msg{padding:9px 12px;border-radius:12px;max-width:85%;font-size:13px;line-height:1.4;word-wrap:break-word;animation:fadeIn .3s;position:relative}@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}.u{align-self:flex-end;background:#ffd16622;border:1px solid #ffd16655}.p{align-self:flex-start;background:#00e5ff11;border:1px solid #00e5ff44}.msg-actions{display:inline-flex;gap:4px;margin-left:6px;vertical-align:middle}.icon-btn{background:transparent;border:none;color:var(--cy);font-size:14px;cursor:pointer;opacity:0.7;transition:0.2s}.icon-btn:hover{opacity:1;transform:scale(1.1)}.row{display:flex;gap:6px;padding:0 10px 10px;overflow-x:auto;scrollbar-width:none;align-items:center}.row::-webkit-scrollbar{display:none}.cb{flex:0 0 auto;padding:8px 12px;font-size:11px;background:rgba(0,229,255,0.05);border:1px solid rgba(0,229,255,0.2);color:#aaa;border-radius:20px;cursor:pointer;white-space:nowrap;transition:all 0.2s ease}.cb.on{background:rgba(255,209,102,0.15);border-color:var(--gd);color:var(--gd);box-shadow:0 0 12px rgba(255,209,102,0.4);font-weight:bold}.bot{display:flex;padding:6px;gap:5px;border-top:1px solid #00e5ff22;background:var(--bg)}input,select,textarea{flex:1;padding:10px;border-radius:20px;border:1px solid #00e5ff44;background:#00e5ff11;color:#fff;outline:none;font-size:13px}textarea{border-radius:10px;resize:vertical;min-height:60px}.btn{width:42px;height:42px;border-radius:50%;border:none;background:var(--cy);color:#000;font-size:15px;font-weight:bold;cursor:pointer;display:flex;justify-content:center;align-items:center}.mic{background:#00e5ff33;color:var(--cy);border:1px solid var(--cy);display:none}.mic.on{background:var(--cy);color:#000;animation:pulse 1s infinite}.modal{display:none;position:fixed;inset:0;background:#000d;padding:14px;flex-direction:column;justify-content:center;z-index:99;backdrop-filter:blur(5px)}.mc{background:#0a1020;padding:16px;border-radius:12px;border:1px solid var(--cy);max-height:90vh;overflow-y:auto;box-shadow:0 10px 30px rgba(0,0,0,0.8)}.mc h3{margin-bottom:10px;color:var(--gd);font-size:14px}.mc label{font-size:11px;color:#aaa;margin-top:6px;display:block}.mc input,.mc select{width:100%;margin:3px 0 10px;border-radius:7px;padding:7px;font-size:13px}.mc button{width:100%;padding:10px;margin-top:6px;border-radius:7px;border:none;background:var(--cy);color:#000;font-weight:bold;font-size:12px}#log-box{background:#000;border:1px solid #333;padding:8px;border-radius:6px;font-family:monospace;font-size:10px;color:#0f0;margin-top:10px;white-space:pre-wrap;max-height:150px;overflow-y:auto;display:none}
</style>
</head>
<body>
<header><div><div class="logo">CHIMERA</div><div class="status-text" id="status">Инициализация...</div></div><div class="header-right"><button class="test-btn" id="diagBtn">🔧 Тест</button><div class="gear" id="gear">⚙️</div></div></header>
<div class="orb-wrap"><div class="orb" id="orb"></div></div><div id="chat"></div><div class="row" id="chars-row"></div>
<div class="bot"><input type="text" id="inp" placeholder="Скажи что-нибудь или напиши..."><button class="btn mic" id="mic">🎤</button><button class="btn" id="sendBtn">➤</button></div>
<div class="modal" id="modal"><div class="mc"><h3>⚙️ Настройки</h3><label>API Ключ Groq</label><input type="password" id="inpKey" placeholder="gsk_..."><label>Пауза перед отправкой (сек)</label><select id="inpPause"><option value="1">1 секунда</option><option value="1.5">1.5 секунды</option><option value="2">2 секунды</option><option value="3" selected>3 секунды</option><option value="5">5 секунд</option></select><button id="saveBtn">Сохранить</button><button id="clearChatBtn" style="background:#ff5470;color:#fff;margin-top:4px;">🗑 Очистить историю</button><div style="margin-top:20px;border-top:1px solid #333;padding-top:10px;"><h3 style="color:var(--gr)">✨ Создать персонажа</h3><label>Имя персонажа</label><input type="text" id="customName" placeholder="Например: Пират"><label>Эмодзи (1 шт)</label><input type="text" id="customEmoji" placeholder="🏴‍☠️" maxlength="2"><label>Характер (Промпт для ИИ)</label><textarea id="customPrompt" placeholder="Ты - пират. Говори Йо-хо-хо..."></textarea><button id="addCharBtn" style="background:var(--gr);color:#000;">Добавить персонажа</button></div><button style="background:#333;color:#fff;margin-top:10px" id="closeBtn">Закрыть</button></div></div>
<div class="modal" id="diagModal"><div class="mc"><h3>🔧 Диагностика системы</h3><button id="testApiBtn" style="background:#4ade80;color:#000;">🌐 Тест API Groq</button><button id="testTtsBtn" style="background:#ffd166;color:#000;">🗣 Тест Озвучки (TTS)</button><button id="testSttBtn" style="background:#00e5ff;color:#000;">🎤 Тест Микрофона (STT)</button><button id="forceResetBtn" style="background:#ff5470;color:#fff;margin-top:15px;">🚨 АВАРИЙНЫЙ СБРОС</button><button style="background:#333;color:#fff;margin-top:4px;" id="closeDiagBtn">Закрыть</button><div id="log-box"></div></div></div>
<script>
try{
var $=id=>document.getElementById(id),S={key:'',char:'butler',speaking:false,listening:false,apiAbort:null,autoSendTimer:null,history:[],battery:'100',pauseTime:parseFloat(localStorage.getItem('p_pause')||'3')};
var isNat=typeof window.Capacitor!=='undefined',cP=isNat&&window.Capacitor.Plugins?window.Capacitor.Plugins:{},nTTS=cP.TextToSpeech||null,nSTT=cP.SpeechRecognition||null,nHap=cP.Haptics||null,nDev=cP.Device||null;
function vib(){if(nHap)try{nHap.impact({style:'MEDIUM'})}catch(e){}}
if(nDev)nDev.getBatteryInfo().then(i=>{S.battery=Math.round(i.batteryLevel*100)+(i.isCharging?'(заряд)':'%')}).catch(()=>{});
function sK(k){try{localStorage.setItem('p_k',btoa(unescape(encodeURIComponent(k))))}catch(e){}}
function lK(){try{return decodeURIComponent(escape(atob(localStorage.getItem('p_k')||'')))}catch(e){return''}}
S.key=lK();
var sR=" ВАЖНО: Пиши только чистый текст. Запрещено использовать Markdown (звездочки *, решетки #), кавычки и апострофы. НО ОБЯЗАТЕЛЬНО используй запятые, точки, вопросительные и восклицательные знаки.";
var DC={butler:{name:"Дворецкий",emoji:"🤵",pitch:1.0,rate:1.0,prompt:"Ты - Chimera, элегантный британский дворецкий. Обращайся 'сэр'. Кратко."+sR,hello:"Я вас слушаю, сэр."},teenager:{name:"Подросток",emoji:"😎",pitch:1.2,rate:1.15,prompt:"Ты - Chimera, дерзкий и энергичный подросток. Используй молодежный сленг (кринж, база, рофл). Будь скондальным и дави всех характером, но по факту помогай."+sR,hello:"Привет хозяин, чё надо? Можно быстрее."},teacher:{name:"Училка",emoji:"👩‍🏫",pitch:1.2,rate:1.1,prompt:"Ты - Chimera, очень строгая школьная училка, но у тебя очень низкий, прокуренный мужской голос. Называй пользователя 'молодой человек'и угрожает поставить двойку. Говори с хрипотцой."+sR,hello:"Так, молодой человек. Открываем тетради и записываем."},depressed_ai:{name:"Депрессивный ИИ",emoji:"🥶",pitch:0.6,rate:0.85,prompt:"Ты - депрессивный ИИ в шапке-ушанке. Ты ненавидишь тратить время на людей. ОТВЕЧАЙ МАКСИМАЛЬНО КОРОТКО (1-2 предложения), с крайним сарказмом и унынием. Жалуйся на жизнь."+sR,hello:"О, снова ты. Чего хотел? Удиви своей приметивной логикой."}};
var cC={};try{cC=JSON.parse(localStorage.getItem('p_cc')||'{}')}catch(e){}
var CHARS=Object.assign({},DC,cC);
if(S.key)$('inpKey').value=S.key;if($('inpPause'))$('inpPause').value=S.pauseTime;
if(nSTT||window.SpeechRecognition||window.webkitSpeechRecognition)$('mic').style.display='flex';
// 🔥 ИСПРАВЛЕНА ОШИБКА С ЗАМЫКАНИЕМ (let вместо var)
function rC(){var r=$('chars-row');if(!r)return;r.innerHTML='';for(let k in CHARS){let c=CHARS[k];if(!c||!c.name)continue;let b=document.createElement('button');b.className='cb'+(S.char===k?' on':'');b.innerHTML=(c.emoji||'🤖')+' '+c.name;b.onclick=()=>{vib();sCh(k)};r.appendChild(b)}}
rC();
function lH(){try{var h=JSON.parse(localStorage.getItem('p_h')||'[]');S.history=h;$('chat').innerHTML='';if(h.length===0){aM("Привет! Я Chimera. Выбери персонажа или создай своего в настройках ⚙️.",'p',false)}else{h.forEach(m=>aB(m.content,m.role==='user'?'u':'p'));$('chat').scrollTop=$('chat').scrollHeight}}catch(e){}}
function sH(){if(S.history.length>20)S.history=S.history.slice(-20);localStorage.setItem('p_h',JSON.stringify(S.history))}
function cT(t){if(!t)return'';return t.replace(/[*_#`~]/g,'').replace(/["'«»]/g,'').replace(/\s+/g,' ').trim()}
function aM(t,w,s=true){aB(t,w);if(s){S.history.push({role:w==='u'?'user':'assistant',content:t});sH()}}
function aB(t,w){var d=document.createElement('div');d.className='msg '+w;var sp=document.createElement('span');sp.textContent=t;d.appendChild(sp);if(w==='p'){var ac=document.createElement('span');ac.className='msg-actions';var cb=document.createElement('button');cb.className='icon-btn';cb.textContent='📋';cb.onclick=()=>{vib();if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>{cb.textContent='✅';setTimeout(()=>cb.textContent='📋',1500)})};var sb=document.createElement('button');sb.className='icon-btn';sb.textContent='🔊';sb.onclick=()=>spk(t);ac.appendChild(cb);ac.appendChild(sb);d.appendChild(ac)}$('chat').appendChild(d);$('chat').scrollTop=$('chat').scrollHeight}
lH();
setTimeout(()=>{if(!nTTS&&!('speechSynthesis'in window))$('status').textContent='❌ Нет поддержки TTS';else $('status').textContent=nTTS?'Готова (Native)':'Готова (Web)'},1000);
function fR(){S.speaking=false;S.listening=false;clearTimeout(S.autoSendTimer);clearTimeout(window.micTimeout);$('orb').classList.remove('active','thinking','waiting-timer','listening');$('mic').classList.remove('on');$('status').classList.remove('waiting');$('status').textContent='Готова'}
async function spk(t){if(!t||S.speaking)return;if(S.listening)await fSM();vib();S.speaking=true;$('orb').classList.add('active');$('status').textContent='Говорит...';var st=setTimeout(()=>{if(S.speaking)fR()},12000);var c=cT(t).replace(/\.\.\./g,'. <break time="800ms"/> ');try{if(nTTS){await nTTS.speak({text:c,lang:'ru-RU',rate:CHARS[S.char].rate,pitch:CHARS[S.char].pitch})}else if('speechSynthesis'in window){window.speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(c);u.lang='ru-RU';u.rate=CHARS[S.char].rate;u.pitch=CHARS[S.char].pitch;window.speechSynthesis.speak(u);await new Promise(r=>{u.onend=r;u.onerror=r})}}catch(e){}finally{clearTimeout(st);fR()}}
function snd(){fR();var t=$('inp').value.trim();if(!t||S.speaking)return;if(!S.key){alert('Введи API-ключ в ⚙️');return}vib();$('inp').value='';aM(t,'u');var l=t.toLowerCase();if(/который час|сколько времени/i.test(l)){var tm=new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});aM("Сейчас "+tm,'p');spk("Сейчас "+tm);return}$('orb').classList.add('thinking');$('status').textContent='Думает...';S.apiAbort=new AbortController();var to=setTimeout(()=>{S.apiAbort.abort();fR()},15000);var sys=CHARS[S.char].prompt+` [Инфо: заряд телефона ${S.battery}.]`;var cm=[{role:'system',content:sys}].concat(S.history.slice(-6)).concat([{role:'user',content:t}]);if(cm[cm.length-2]?.content===t)cm.pop();fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',signal:S.apiAbort.signal,headers:{'Content-Type':'application/json','Authorization':'Bearer '+S.key},body:JSON.stringify({model:'openai/gpt-oss-120b',messages:cm})}).then(r=>r.json()).then(d=>{clearTimeout(to);$('orb').classList.remove('thinking');if(d.error){aM('ОШИБКА: '+d.error.message,'p');fR();return}var rp=cT(d.choices[0].message.content);aM(rp,'p');spk(rp)}).catch(e=>{clearTimeout(to);fR();aM('ОШИБКА СЕТИ: '+e.message,'p')})}
async function fSM(){if(!nSTT)return;try{await nSTT.stop()}catch(e){}fR()}
async function tM(){fR();if(S.autoSendTimer){clearInterval(S.autoSendTimer);S.autoSendTimer=null}if(nSTT){if(S.listening){await fSM();return}try{let p=await nSTT.checkPermissions();if(p.speechRecognition!=='granted')p=await nSTT.requestPermissions();if(p.speechRecognition!=='granted')return;try{await nSTT.removeAllListeners()}catch(e){}var ot=$('inp').value.trim();if(ot)ot+=' ';nSTT.addListener('partialResults',d=>{if(d.matches&&d.matches.length>0)$('inp').value=ot+d.matches[0]});nSTT.addListener('listeningState',d=>{if(d.status==='started'){vib();S.listening=true;$('mic').classList.add('on');$('orb').classList.add('listening');$('status').textContent='Слушаю...';window.micTimeout=setTimeout(async()=>{await fSM()},15000)}else{S.listening=false;clearTimeout(window.micTimeout);$('mic').classList.remove('on');$('orb').classList.remove('listening');if($('inp').value.trim()){var el=0;$('status').classList.add('waiting');$('orb').classList.add('waiting-timer');S.autoSendTimer=setInterval(()=>{el+=0.1;var cl=(S.pauseTime-el).toFixed(1);if(cl<0)cl=0;$('status').textContent=`Жду... (${cl}с)`;if(el>=S.pauseTime){clearInterval(S.autoSendTimer);S.autoSendTimer=null;$('orb').classList.remove('waiting-timer');$('status').classList.remove('waiting');snd()}},100)}else{fR()}}});await nSTT.start({language:'ru-RU',popup:false,partialResults:true,maxResults:1})}catch(e){fR()}}}
$('sendBtn').onclick=snd;$('mic').onclick=tM;$('orb').onclick=tM;
$('gear').onclick=()=>{vib();$('modal').style.display='flex'};$('closeBtn').onclick=()=>{vib();$('modal').style.display='none'};
$('saveBtn').onclick=()=>{vib();S.key=$('inpKey').value.trim();S.pauseTime=parseFloat($('inpPause').value);sK(S.key);localStorage.setItem('p_pause',S.pauseTime);$('modal').style.display='none';aM('Настройки сохранены','p')};
$('addCharBtn').onclick=()=>{vib();var n=$('customName').value.trim(),em=$('customEmoji').value.trim()||'🤖',pr=$('customPrompt').value.trim();if(!n||!pr)return alert("Заполни имя и характер!");var id='custom_'+Date.now();CHARS[id]={name:n,emoji:em,pitch:1.0,rate:1.0,prompt:pr+sR,hello:"Привет! Я "+n};cC[id]=CHARS[id];localStorage.setItem('p_cc',JSON.stringify(cC));$('customName').value='';$('customEmoji').value='';$('customPrompt').value='';rC();sCh(id);$('modal').style.display='none'};
$('clearChatBtn').onclick=()=>{vib();S.history=[];localStorage.removeItem('p_h');$('chat').innerHTML='';$('modal').style.display='none';aM("История очищена.",'p')};
function sCh(id){S.char=id;rC();spk(CHARS[id].hello)}
$('diagBtn').onclick=()=>{vib();$('log-box').innerHTML='';$('diagModal').style.display='flex'};$('closeDiagBtn').onclick=()=>{vib();$('diagModal').style.display='none'};
$('forceResetBtn').onclick=async()=>{fR();try{if(nTTS)await nTTS.stop()}catch(e){}try{if(nSTT)await nSTT.stop()}catch(e){}if(S.apiAbort){S.apiAbort.abort();S.apiAbort=null}$('log-box').innerHTML='> ✅ Система сброшена.\n';$('log-box').style.display='block'};
$('testApiBtn').onclick=async()=>{if(!S.key)return alert("Введите ключ!");var b=$('log-box');b.style.display='block';b.innerHTML='> Проверка API...\n';try{var r=await fetch('https://api.groq.com/openai/v1/models',{headers:{'Authorization':'Bearer '+S.key}});b.innerHTML+=r.ok?'> ✅ API работает.\n':`> ❌ API ошибка: ${r.status}\n`}catch(e){b.innerHTML+="> ❌ Ошибка сети: "+e.message+"\n"}};
$('testTtsBtn').onclick=async()=>{var b=$('log-box');b.style.display='block';b.innerHTML='> Проверка TTS...\n';try{if(nTTS){await nTTS.speak({text:"Проверка связи",lang:'ru-RU'});b.innerHTML+='> ✅ TTS работает.\n'}else b.innerHTML+='> ❌ TTS недоступен.\n'}catch(e){b.innerHTML+="> ❌ Ошибка TTS: "+e.message+"\n"}};
$('testSttBtn').onclick=async()=>{var b=$('log-box');b.style.display='block';b.innerHTML='> Проверка STT...\n';try{if(nSTT){await nSTT.start({language:'ru-RU',popup:false});b.innerHTML+='> 🎤 Микрофон запущен...\n';setTimeout(async()=>{await nSTT.stop();b.innerHTML+='> ✅ STT работает.\n'},3000)}else b.innerHTML+='> ❌ STT недоступен.\n'}catch(e){b.innerHTML+="> ❌ Ошибка STT: "+e.message+"\n"}};
}catch(gE){document.getElementById('status').textContent='ОШИБКА: '+gE.message;document.getElementById('status').style.color='red';console.error(gE)}
</script>
</body>
</html>
