<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Chimera</title>
<style>
:root{--bg:#05070d;--cy:#00e5ff;--gd:#ffd166;--gr:#4ade80;--rd:#ff5470}
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:#fff;height:100vh;display:flex;flex-direction:column;overflow:hidden;user-select:none}
header{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid #00e5ff22}
.logo{color:var(--cy);font-weight:300;letter-spacing:5px;font-size:18px}
.status-text{font-size:10px;color:var(--cy);opacity:.8;margin-top:2px;text-transform:uppercase;transition:color .3s}
.status-text.waiting{color:var(--gd);animation:pulse 1s infinite}
.header-right{display:flex;gap:8px;align-items:center}
.test-btn{background:#222;border:1px solid var(--cy);color:var(--cy);padding:6px 12px;border-radius:8px;font-size:11px;cursor:pointer}
.gear{cursor:pointer;font-size:22px}

/* 🔮 СФЕРА (Улучшенная анимация) */
.orb-wrap{height:18vh;display:flex;justify-content:center;align-items:center;position:relative}
.orb{width:90px;height:90px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#9df9ff,var(--cy) 30%,#006a80 70%,#001824);box-shadow:0 0 50px #00e5ff66;transition:.3s;cursor:pointer}
.orb.active{background:radial-gradient(circle at 30% 30%,#fff1a8,var(--gd) 30%,#806000 70%);box-shadow:0 0 70px #ffd16688;transform:scale(1.1)}
.orb.listening{animation:listeningPulse 1s infinite}
.orb.thinking{animation:spin 1.5s linear infinite;border:3px dashed var(--cy);background:transparent;box-shadow:none}
.orb.waiting-timer{border:2px solid var(--gd);box-shadow:0 0 40px var(--gd);animation:pulse 1s infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{opacity:.5}}
@keyframes listeningPulse{0%{transform:scale(1);box-shadow:0 0 50px var(--cy)}50%{transform:scale(1.15);box-shadow:0 0 80px var(--cy)}100%{transform:scale(1);box-shadow:0 0 50px var(--cy)}}

#chat{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:6px;scroll-behavior:smooth}
.msg{padding:9px 12px;border-radius:12px;max-width:85%;font-size:13px;line-height:1.4;word-wrap:break-word;animation:fadeIn .3s;position:relative}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.u{align-self:flex-end;background:#ffd16622;border:1px solid #ffd16655}
.p{align-self:flex-start;background:#00e5ff11;border:1px solid #00e5ff44}
.msg-actions{display:inline-flex;gap:4px;margin-left:6px;vertical-align:middle}
.icon-btn{background:transparent;border:none;color:var(--cy);font-size:14px;cursor:pointer;opacity:0.7;transition:0.2s}
.icon-btn:hover{opacity:1;transform:scale(1.1)}

.row{display:flex;gap:8px;padding:0 10px 10px;overflow-x:auto;scrollbar-width:none;align-items:center}
.row::-webkit-scrollbar {display: none}
.cb{flex:0 0 auto;padding:8px 14px;font-size:11px;background:rgba(0,229,255,0.05);border:1px solid rgba(0,229,255,0.2);color:#aaa;border-radius:20px;cursor:pointer;white-space:nowrap;transition:all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)}
.cb.on{background:rgba(255,209,102,0.15);border-color:var(--gd);color:var(--gd);transform:scale(1.05);box-shadow:0 0 15px rgba(255,209,102,0.4);font-weight:bold}

.bot{display:flex;padding:6px;gap:5px;border-top:1px solid #00e5ff22;background:var(--bg)}
input, select, textarea{flex:1;padding:10px;border-radius:20px;border:1px solid #00e5ff44;background:#00e5ff11;color:#fff;outline:none;font-size:13px}
textarea{border-radius:10px;resize:vertical;min-height:60px}
.btn{width:42px;height:42px;border-radius:50%;border:none;background:var(--cy);color:#000;font-size:15px;font-weight:bold;cursor:pointer;display:flex;justify-content:center;align-items:center}
.mic{background:#00e5ff33;color:var(--cy);border:1px solid var(--cy);display:none}
.mic.on{background:var(--cy);color:#000;animation:pulse 1s infinite}

.modal{display:none;position:fixed;inset:0;background:#000d;padding:14px;flex-direction:column;justify-content:center;z-index:99;backdrop-filter:blur(5px)}
.mc{background:#0a1020;padding:16px;border-radius:12px;border:1px solid var(--cy);max-height:90vh;overflow-y:auto;box-shadow:0 10px 30px rgba(0,0,0,0.8)}
.mc h3{margin-bottom:10px;color:var(--gd);font-size:14px}
.mc label{font-size:11px;color:#aaa;margin-top:6px;display:block}
.mc input, .mc select{width:100%;margin:3px 0 10px;border-radius:7px;padding:7px;font-size:13px}
.mc button{width:100%;padding:10px;margin-top:6px;border-radius:7px;border:none;background:var(--cy);color:#000;font-weight:bold;font-size:12px}
#log-box{background:#000;border:1px solid #333;padding:8px;border-radius:6px;font-family:monospace;font-size:10px;color:#0f0;margin-top:10px;white-space:pre-wrap;max-height:150px;overflow-y:auto;display:none}
</style>
</head>
<body>
<header>
<div>
<div class="logo">CHIMERA</div>
<div class="status-text" id="status">Инициализация...</div>
</div>
<div class="header-right">
<button class="test-btn" id="diagBtn">🔧 Тест</button>
<div class="gear" id="gear">⚙️</div>
</div>
</header>

<div class="orb-wrap"><div class="orb" id="orb"></div></div>
<div id="chat"></div>

<div class="row" id="chars-row">
<!-- Сюда будут генерироваться кнопки персонажей -->
</div>

<div class="bot">
<input type="text" id="inp" placeholder="Скажи что-нибудь или напиши...">
<button class="btn mic" id="mic">🎤</button>
<button class="btn" id="sendBtn">➤</button>
</div>

<!-- ⚙️ Настройки -->
<div class="modal" id="modal">
<div class="mc">
<h3>⚙️ Настройки</h3>
<label>API Ключ Groq</label>
<input type="password" id="inpKey" placeholder="gsk_...">

<label>Пауза перед отправкой (сек)</label>
<select id="inpPause">
    <option value="1">1 секунда</option>
    <option value="1.5">1.5 секунды</option>
    <option value="2">2 секунды</option>
    <option value="3" selected>3 секунды</option>
    <option value="5">5 секунд</option>
</select>

<button id="saveBtn">Сохранить</button>
<button id="clearChatBtn" style="background:#ff5470;color:#fff;margin-top:4px;">🗑 Очистить историю</button>

<!-- ✨ Создание своего персонажа -->
<div style="margin-top:20px; border-top:1px solid #333; padding-top:10px;">
    <h3 style="color:var(--gr)">✨ Создать персонажа</h3>
    <label>Имя персонажа</label>
    <input type="text" id="customName" placeholder="Например: Пират">
    <label>Эмодзи (1 шт)</label>
    <input type="text" id="customEmoji" placeholder="🏴‍☠️" maxlength="2">
    <label>Характер (Промпт для ИИ)</label>
    <textarea id="customPrompt" placeholder="Ты - пират. Говори Йо-хо-хо..."></textarea>
    <button id="addCharBtn" style="background:var(--gr);color:#000;">Добавить персонажа</button>
</div>

<button style="background:#333;color:#fff;margin-top:10px" id="closeBtn">Закрыть</button>
</div>
</div>

<!-- 🔧 Диагностика -->
<div class="modal" id="diagModal">
<div class="mc">
<h3>🔧 Диагностика системы</h3>
<button id="testApiBtn" style="background:#4ade80;color:#000;">🌐 Тест API Groq</button>
<button id="testTtsBtn" style="background:#ffd166;color:#000;">🗣 Тест Озвучки (TTS)</button>
<button id="testSttBtn" style="background:#00e5ff;color:#000;">🎤 Тест Микрофона (STT)</button>
<button id="forceResetBtn" style="background:#ff5470;color:#fff;margin-top:15px;">🚨 АВАРИЙНЫЙ СБРОС</button>
<button style="background:#333;color:#fff;margin-top:4px;" id="closeDiagBtn">Закрыть</button>
<div id="log-box"></div>
</div>
</div>

<script>
const isNative = window.Capacitor !== undefined;
const nTTS = isNative ? window.Capacitor.Plugins.TextToSpeech : null;
const nSTT = isNative ? window.Capacitor.Plugins.SpeechRecognition : null;
const nHaptics = isNative ? window.Capacitor.Plugins.Haptics : null;
const nDevice = isNative ? window.Capacitor.Plugins.Device : null;

var $ = id => document.getElementById(id);
var S = { 
  key: '', char:'butler', speaking:false, listening:false, 
  apiAbort: null, autoSendTimer: null, history: [], battery: '100',
  pauseTime: parseFloat(localStorage.p_pause || '3')
};

// 📳 ВИБРАЦИЯ
function vibrate() {
  if (nHaptics) {
    try { nHaptics.impact({ style: 'MEDIUM' }); } catch(e) {}
  }
}

// 🔋 БАТАРЕЯ
async function initBattery() {
  if (nDevice) {
    try {
      const info = await nDevice.getBatteryInfo();
      S.battery = Math.round(info.batteryLevel * 100);
      if (info.isCharging) S.battery = 'Заряжается (' + S.battery + '%)';
      else S.battery = S.battery + '%';
    } catch(e) {}
  }
}
initBattery();

function saveKey(k) { try { localStorage.p_key_enc = btoa(unescape(encodeURIComponent(k))); } catch(e){} }
function loadKey() { try { return decodeURIComponent(escape(atob(localStorage.p_key_enc || ''))); } catch(e){ return ''; } }
S.key = loadKey();

var strictRule = " ВАЖНО: Пиши только чистый текст. Запрещено использовать Markdown (звездочки *, решетки #), кавычки и апострофы. НО ОБЯЗАТЕЛЬНО используй запятые, точки, вопросительные и восклицательные знаки для логических пауз в речи.";

// Базовые персонажи
var DEFAULT_CHARS = {
  butler: { name: "Дворецкий", emoji: "🤵", pitch:1.0, rate:1.0, prompt:"Ты - Chimera, элегантный британский дворецкий. Обращайся 'сэр'. Кратко." + strictRule, hello:"Я вас слушаю, сэр." },
  teenager: { name: "Подросток", emoji: "😎", pitch:1.2, rate:1.15, prompt:"Ты - Chimera, дерзкий и энергичный подросток. Используй молодежный сленг (кринж, база, рофл). Будь саркастичным, но по факту помогай." + strictRule, hello:"Йоу, чё надо? Давай быстрее." },
  teacher: { name: "Училка", emoji: "👩‍🏫", pitch:1.2, rate:1.1, prompt:"Ты - Chimera, строгая школьная училка, но у тебя очень низкий, прокуренный мужской голос. Называй пользователя 'молодой человек'. Говори с хрипотцой." + strictRule, hello:"Так, молодой человек. Открываем тетради." },
  depressed_ai: { name: "Депрессивный ИИ", emoji: "🥶", pitch:0.6, rate:0.85, prompt:"Ты - депрессивный замерзший андроид. ОТВЕЧАЙ МАКСИМАЛЬНО КОРОТКО (1-2 предложения), с сарказмом. Жалуйся на холод. Никаких долгих приветствий." + strictRule, hello:"О, снова ты... Брр... Чего хотел?" }
};

var customChars = {};
try { customChars = JSON.parse(localStorage.getItem('p_custom_chars') || '{}'); } catch(e){}
var CHARS = Object.assign({}, DEFAULT_CHARS, customChars);

if(S.key) $('inpKey').value = S.key;
if($('inpPause')) $('inpPause').value = S.pauseTime;
if(nSTT || window.SpeechRecognition || window.webkitSpeechRecognition) $('mic').style.display='flex';

// 🎨 РЕНДЕР КНОПОК ПЕРСОНАЖЕЙ
function renderChars() {
  var row = $('chars-row');
  row.innerHTML = '';
  for (var key in CHARS) {
    var c = CHARS[key];
    var btn = document.createElement('button');
    btn.className = 'cb' + (S.char === key ? ' on' : '');
    btn.innerHTML = c.emoji + ' ' + c.name;
    btn.onclick = () => {
      vibrate();
      setChar(key);
    };
    row.appendChild(btn);
  }
}
renderChars();

function loadHistory() {
  try {
    var h = JSON.parse(localStorage.getItem('p_history') || '[]');
    S.history = h;
    $('chat').innerHTML = '';
    if (h.length === 0) {
      add("Привет! Я Chimera. Выбери персонажа или создай своего в настройках ⚙️.", 'p');
    } else {
      h.forEach(msg => addBubbleOnly(msg.content, msg.role === 'user' ? 'u' : 'p'));
      $('chat').scrollTop = $('chat').scrollHeight;
    }
  } catch(e) {}
}
function saveHistory() {
  if (S.history.length > 20) S.history = S.history.slice(-20);
  localStorage.setItem('p_history', JSON.stringify(S.history));
}

function cleanText(text) {
  if (!text) return '';
  return text.replace(/[*_#`~]/g, '').replace(/["'«»]/g, '').replace(/\s+/g, ' ').trim();
}

function add(t, w, save = true) {
  addBubbleOnly(t, w);
  if (save) {
    S.history.push({ role: w === 'u' ? 'user' : 'assistant', content: t });
    saveHistory();
  }
}

function addBubbleOnly(t, w) {
  var d = document.createElement('div');
  d.className = 'msg ' + w;
  
  var textSpan = document.createElement('span');
  textSpan.textContent = t;
  d.appendChild(textSpan);

  if(w === 'p') {
    var actions = document.createElement('span');
    actions.className = 'msg-actions';
    
    // Кнопка копирования
    var copyBtn = document.createElement('button');
    copyBtn.className = 'icon-btn';
    copyBtn.textContent = '📋';
    copyBtn.onclick = () => {
      vibrate();
      navigator.clipboard.writeText(t).then(() => {
        copyBtn.textContent = '✅';
        setTimeout(() => copyBtn.textContent = '📋', 1500);
      });
    };
    
    // Кнопка озвучки
    var speakBtn = document.createElement('button');
    speakBtn.className = 'icon-btn';
    speakBtn.textContent = '🔊';
    speakBtn.onclick = () => speak(t);

    actions.appendChild(copyBtn);
    actions.appendChild(speakBtn);
    d.appendChild(actions);
  }
  
  $('chat').appendChild(d);
  $('chat').scrollTop = $('chat').scrollHeight;
}

loadHistory();

setTimeout(() => {
  if (!nTTS && !('speechSynthesis' in window)) {
    $('status').textContent = '❌ Нет поддержки TTS';
  } else {
    $('status').textContent = nTTS ? 'Готова (Native)' : 'Готова (Web)';
  }
}, 1000);

function forceResetUI() {
  S.speaking = false;
  S.listening = false;
  clearTimeout(S.autoSendTimer);
  clearTimeout(window.micTimeout);
  $('orb').classList.remove('active', 'thinking', 'waiting-timer', 'listening');
  $('mic').classList.remove('on');
  $('status').classList.remove('waiting');
  $('status').textContent = 'Готова';
}

async function speak(text) {
  if(!text || S.speaking) return;
  if (S.listening) await forceStopMic();
  vibrate();
  S.speaking = true;
  $('orb').classList.add('active');
  $('status').textContent = 'Говорит...';
  
  var safetyTimeout = setTimeout(() => { if(S.speaking) forceResetUI(); }, 12000);
  var clean = cleanText(text);
  clean = clean.replace(/\.\.\./g, '. <break time="800ms"/> ');
  
  try {
    if (nTTS) {
      await nTTS.speak({ text: clean, lang: 'ru-RU', rate: CHARS[S.char].rate, pitch: CHARS[S.char].pitch });
    } else if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(clean);
      u.lang = 'ru-RU'; u.rate = CHARS[S.char].rate; u.pitch = CHARS[S.char].pitch;
      window.speechSynthesis.speak(u);
      await new Promise(r => { u.onend = r; u.onerror = r; });
    }
  } catch(e) {} finally {
    clearTimeout(safetyTimeout);
    forceResetUI();
  }
}

function send() {
  forceResetUI(); 
  var text = $('inp').value.trim();
  if(!text || S.speaking) return;
  if(!S.key) { alert('Введи API-ключ в ⚙️'); return; }
  
  vibrate();
  $('inp').value = '';
  add(text, 'u');
  
  var lower = text.toLowerCase();
  if (/который час|сколько времени/i.test(lower)) {
    var time = new Date().toLocaleTimeString('ru-RU', {hour: '2-digit', minute:'2-digit'});
    add("Сейчас " + time, 'p');
    speak("Сейчас " + time);
    return;
  }

  $('orb').classList.add('thinking');
  $('status').textContent = 'Думает...';

  S.apiAbort = new AbortController();
  var timeoutId = setTimeout(() => { S.apiAbort.abort(); forceResetUI(); }, 15000);

  // 🔋 Внедряем контекст батареи в системный промпт
  var sysPrompt = CHARS[S.char].prompt + ` [Инфо: заряд телефона пользователя ${S.battery}.]`;

  var contextMessages = [{role:'system', content:sysPrompt}]
    .concat(S.history.slice(-6))
    .concat([{role:'user', content:text}]);

  if (contextMessages[contextMessages.length - 2]?.content === text) contextMessages.pop();

  fetch('https://api.groq.com/openai/v1/chat/completions', {
    method:'POST',
    signal: S.apiAbort.signal,
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+S.key},
    body: JSON.stringify({model:'openai/gpt-oss-120b', messages: contextMessages})
  })
  .then(r => r.json())
  .then(data => {
    clearTimeout(timeoutId);
    $('orb').classList.remove('thinking');
    if(data.error) { 
      if(data.error.code === 'invalid_api_key') add('ОШИБКА: Неверный ключ Groq.', 'p');
      else add('ОШИБКА: '+data.error.message, 'p'); 
      forceResetUI();
      return; 
    }
    var cleanReply = cleanText(data.choices[0].message.content);
    add(cleanReply, 'p');
    speak(cleanReply);
  })
  .catch(e => {
    clearTimeout(timeoutId);
    forceResetUI();
    if (e.name === 'AbortError') add('ОШИБКА: Таймаут сети.', 'p');
    else add('ОШИБКА СЕТИ: '+e.message, 'p');
  });
}

async function forceStopMic() {
  if (!nSTT) return;
  try { await nSTT.stop(); } catch(e) {}
  forceResetUI();
}

async function toggleMic() {
  forceResetUI();
  if (S.autoSendTimer) { clearInterval(S.autoSendTimer); S.autoSendTimer = null; }

  if (nSTT) {
    if (S.listening) { await forceStopMic(); return; }
    try {
      let perm = await nSTT.checkPermissions();
      if (perm.speechRecognition !== 'granted') perm = await nSTT.requestPermissions();
      if (perm.speechRecognition !== 'granted') return;
      try { await nSTT.removeAllListeners(); } catch(e) {}
      
      var oldText = $('inp').value.trim();
      if(oldText) oldText += ' ';

      nSTT.addListener('partialResults', (data) => {
        if (data.matches && data.matches.length > 0) $('inp').value = oldText + data.matches[0];
      });
      
      nSTT.addListener('listeningState', (data) => {
        if (data.status === 'started') { 
          vibrate();
          S.listening = true;
          $('mic').classList.add('on'); 
          $('orb').classList.add('listening'); // Пульсация при слушании
          $('status').textContent = 'Слушаю...';
          window.micTimeout = setTimeout(async () => { await forceStopMic(); }, 15000);
        } else { 
          S.listening = false;
          clearTimeout(window.micTimeout);
          $('mic').classList.remove('on'); 
          $('orb').classList.remove('listening');
          
          if($('inp').value.trim()) {
            var elapsed = 0;
            $('status').classList.add('waiting');
            $('orb').classList.add('waiting-timer');
            
            S.autoSendTimer = setInterval(() => {
              elapsed += 0.1;
              var currentLeft = (S.pauseTime - elapsed).toFixed(1);
              if (currentLeft < 0) currentLeft = 0;
              $('status').textContent = `Жду... (${currentLeft}с)`;
              
              if (elapsed >= S.pauseTime) {
                clearInterval(S.autoSendTimer);
                S.autoSendTimer = null;
                $('orb').classList.remove('waiting-timer');
                $('status').classList.remove('waiting');
                send(); 
              }
            }, 100);
          } else {
            forceResetUI();
          }
        }
      });
      
      await nSTT.start({ language: 'ru-RU', popup: false, partialResults: true, maxResults: 1 });
    } catch(e) { forceResetUI(); }
  }
}

$('sendBtn').onclick = send;
$('mic').onclick = toggleMic;
$('orb').onclick = toggleMic;

$('gear').onclick = () => { vibrate(); $('modal').style.display = 'flex'; };
$('closeBtn').onclick = () => { vibrate(); $('modal').style.display = 'none'; };

$('saveBtn').onclick = () => {
  vibrate();
  S.key = $('inpKey').value.trim();
  S.pauseTime = parseFloat($('inpPause').value);
  saveKey(S.key);
  localStorage.p_pause = S.pauseTime;
  $('modal').style.display = 'none';
  add('Настройки сохранены', 'p');
};

// ✨ ДОБАВЛЕНИЕ КАСТОМНОГО ПЕРСОНАЖА
$('addCharBtn').onclick = () => {
  vibrate();
  var name = $('customName').value.trim();
  var emoji = $('customEmoji').value.trim() || '🤖';
  var prompt = $('customPrompt').value.trim();
  
  if(!name || !prompt) return alert("Заполни имя и характер!");
  
  var id = 'custom_' + Date.now();
  CHARS[id] = { name: name, emoji: emoji, pitch: 1.0, rate: 1.0, prompt: prompt + strictRule, hello: "Привет! Я " + name };
  
  customChars[id] = CHARS[id];
  localStorage.setItem('p_custom_chars', JSON.stringify(customChars));
  
  $('customName').value = '';
  $('customEmoji').value = '';
