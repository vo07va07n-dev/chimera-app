<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Chimera</title>
<style>
:root{--bg:#05070d;--cy:#00e5ff;--gd:#ffd166;--gr:#4ade80;--rd:#ff5470;--glass:rgba(10,16,32,0.85)}
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(circle at 50% 0%, #0a1226 0%, var(--bg) 70%);color:#fff;height:100vh;display:flex;flex-direction:column;overflow:hidden;user-select:none; padding-bottom: env(safe-area-inset-bottom);}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid rgba(0,229,255,0.1);backdrop-filter:blur(10px)}
.logo{color:var(--cy);font-weight:300;letter-spacing:6px;font-size:18px;text-shadow:0 0 10px rgba(0,229,255,0.5)}
.status-text{font-size:10px;color:var(--cy);opacity:.8;margin-top:2px;text-transform:uppercase;transition:color .3s;letter-spacing:1px}
.status-text.waiting{color:var(--gd);animation:pulse 1s infinite}
.header-right{display:flex;gap:10px;align-items:center}
.test-btn{background:rgba(0,229,255,0.1);border:1px solid var(--cy);color:var(--cy);padding:6px 14px;border-radius:12px;font-size:11px;cursor:pointer;transition:.2s}
.gear{cursor:pointer;font-size:22px;transition:transform .3s}.gear:active{transform:rotate(90deg)}
.orb-wrap{height:16vh;display:flex;justify-content:center;align-items:center;position:relative}
.orb{width:80px;height:80px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#9df9ff,var(--cy) 30%,#006a80 70%,#001824);box-shadow:0 0 60px rgba(0,229,255,0.4), inset 0 0 20px rgba(255,255,255,0.5);transition:.3s;cursor:pointer}
.orb.active{background:radial-gradient(circle at 30% 30%,#fff1a8,var(--gd) 30%,#806000 70%);box-shadow:0 0 80px rgba(255,209,102,0.6);transform:scale(1.1)}
.orb.listening{animation:listeningPulse 1s infinite}
.orb.thinking{animation:spin 1.5s linear infinite;border:3px dashed var(--cy);background:transparent;box-shadow:none}
.orb.waiting-timer{border:2px solid var(--gd);box-shadow:0 0 40px var(--gd);animation:pulse 1s infinite}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{opacity:.5}}
@keyframes listeningPulse{0%{transform:scale(1);box-shadow:0 0 50px var(--cy)}50%{transform:scale(1.15);box-shadow:0 0 80px var(--cy)}100%{transform:scale(1);box-shadow:0 0 50px var(--cy)}}
#chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
.msg{padding:12px 16px;border-radius:18px;max-width:85%;font-size:14px;line-height:1.5;word-wrap:break-word;animation:fadeIn .3s;position:relative;backdrop-filter:blur(5px)}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.u{align-self:flex-end;background:rgba(255,209,102,0.15);border:1px solid rgba(255,209,102,0.4);border-bottom-right-radius:4px}
.p{align-self:flex-start;background:rgba(0,229,255,0.08);border:1px solid rgba(0,229,255,0.3);border-bottom-left-radius:4px}
.msg-actions{display:inline-flex;gap:6px;margin-left:8px;vertical-align:middle}
.icon-btn{background:transparent;border:none;color:var(--cy);font-size:15px;cursor:pointer;opacity:0.6;transition:0.2s}
.icon-btn:hover{opacity:1;transform:scale(1.1)}
.row{display:flex;gap:8px;padding:0 16px 12px;overflow-x:auto;scrollbar-width:none;align-items:center}
.row::-webkit-scrollbar{display:none}
.cb{flex:0 0 auto;padding:8px 16px;font-size:12px;background:rgba(0,229,255,0.05);border:1px solid rgba(0,229,255,0.15);color:#aaa;border-radius:24px;cursor:pointer;white-space:nowrap;transition:all 0.2s;position:relative;display:flex;align-items:center;gap:4px}
.cb.on{background:rgba(255,209,102,0.15);border-color:var(--gd);color:var(--gd);box-shadow:0 0 15px rgba(255,209,102,0.3)}
.del-btn{background:none;border:none;color:var(--rd);font-size:14px;margin-left:6px;cursor:pointer}
.bot{display:flex;padding:10px 16px;gap:8px;border-top:1px solid rgba(0,229,255,0.1);background:var(--glass);backdrop-filter:blur(20px);align-items:center}
.input-wrap{position:relative;flex:1;display:flex}
input,select,textarea{width:100%;padding:12px 16px;border-radius:24px;border:1px solid rgba(0,229,255,0.2);background:rgba(0,229,255,0.05);color:#fff;outline:none;font-size:14px;transition:.3s}
input:focus,textarea:focus{border-color:var(--cy);box-shadow:0 0 15px rgba(0,229,255,0.2)}
textarea{border-radius:16px;resize:vertical;min-height:80px}
.btn{width:46px;height:46px;border-radius:50%;border:none;background:var(--cy);color:#000;font-size:16px;font-weight:bold;cursor:pointer;display:flex;justify-content:center;align-items:center;transition:.2s;box-shadow:0 0 15px rgba(0,229,255,0.4);flex-shrink:0}
.btn:active{transform:scale(0.9)}
.mic,.cam{background:rgba(0,229,255,0.1);color:var(--cy);border:1px solid var(--cy);box-shadow:none}
.mic.on{background:var(--cy);color:#000;animation:pulse 1s infinite}
.btn.send-inline{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:36px;height:36px;font-size:14px;display:none;box-shadow:none;}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);padding:20px;flex-direction:column;justify-content:center;z-index:99;backdrop-filter:blur(8px)}
.mc{background:var(--glass);padding:20px;border-radius:20px;border:1px solid rgba(0,229,255,0.3);max-height:90vh;overflow-y:auto;box-shadow:0 20px 40px rgba(0,0,0,0.6)}
.mc h3{margin-bottom:15px;color:var(--gd);font-size:16px;letter-spacing:1px}
.mc label{font-size:11px;color:#889;margin-top:10px;display:block;text-transform:uppercase}
.mc input,.mc select{width:100%;margin:5px 0 15px;border-radius:10px;padding:10px;font-size:14px}
.mc button{width:100%;padding:12px;margin-top:8px;border-radius:12px;border:none;background:var(--cy);color:#000;font-weight:bold;font-size:14px;transition:.2s}
.mc button:active{transform:scale(0.98)}
#log-box{background:#000;border:1px solid #333;padding:10px;border-radius:8px;font-family:monospace;font-size:11px;color:var(--gr);margin-top:15px;white-space:pre-wrap;max-height:150px;overflow-y:auto;display:none}

#cropModal { display: none; position: fixed; inset: 0; background: #000; z-index: 200; flex-direction: column; overflow: hidden; touch-action: none; }
#cropContainer { flex: 1; position: relative; overflow: hidden; display: flex; justify-content: center; align-items: center; }
#cropImage { position: absolute; transform-origin: center center; will-change: transform; max-width: none; pointer-events: none; }
.crop-frame { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 85vw; height: 40vh; border: 2px solid var(--cy); box-shadow: 0 0 0 9999px rgba(0,0,0,0.65); pointer-events: none; z-index: 10; }
.crop-frame::before, .crop-frame::after { content: ''; position: absolute; width: 20px; height: 20px; border: 3px solid var(--cy); }
.crop-frame::before { top: -2px; left: -2px; border-right: none; border-bottom: none; }
.crop-frame::after { bottom: -2px; right: -2px; border-left: none; border-top: none; }
.crop-hint { position: absolute; bottom: 20px; left: 0; right: 0; text-align: center; color: #aaa; font-size: 12px; z-index: 10; }
#cropControls { padding: 20px; display: flex; justify-content: center; gap: 10px; background: #0a1020; border-top: 1px solid #333; z-index: 20; }
#cropControls button { padding: 12px 24px; border-radius: 12px; font-weight: bold; border: none; font-size: 14px; }

#stopAutoBtn {
    display: none; position: fixed; top: 70px; right: 20px; z-index: 50;
    background: var(--rd); color: #fff; border: none; padding: 10px 16px;
    border-radius: 20px; font-weight: bold; box-shadow: 0 4px 15px rgba(255,84,112,0.5);
    animation: pulse 1s infinite; cursor: pointer; font-size: 14px;
}
</style>
</head>
<body>
<header>
<div>
<div class="logo">CHIMERA</div>
<div class="status-text" id="status">Инициализация...</div>
</div>
<div class="header-right">
<button class="test-btn" id="diagBtn">🔧 Тест</button>
<div class="gear" id="gear">⚙️</div>
</div>
</header>

<button id="stopAutoBtn" onclick="stopAutoDialogue()">🛑 Стоп</button>

<div class="orb-wrap"><div class="orb" id="orb"></div></div>
<div id="chat"></div>
<div class="row" id="chars-row"></div>

<div class="bot">
<div class="input-wrap">
<input type="text" id="inp" placeholder="Скажи что-нибудь..." oninput="toggleBtns()">
<button class="btn send-inline" id="sendBtn">➤</button>
</div>
<input type="file" id="camFallback" accept="image/*" capture="environment" style="display:none;">
<button class="btn cam" id="camBtn">📷</button>
<button class="btn mic" id="mic">🎤</button>
</div>

<div id="cropModal">
    <div id="cropContainer">
        <img id="cropImage" alt="crop">
        <div class="crop-frame"></div>
        <div class="crop-hint">Двигай и масштабируй фото двумя пальцами</div>
    </div>
    <div id="cropControls">
        <button id="cropCancelBtn" style="background: #333; color: #fff;">Отмена</button>
        <button id="cropDoneBtn" style="background: var(--cy); color: #000;">Обрезать и решить</button>
    </div>
</div>

<div class="modal" id="modal"><div class="mc">
<h3>⚙️ Настройки</h3>
<label>Провайдер ИИ (для обычного чата)</label>
<select id="inpProvider">
    <option value="groq">Groq (быстрый, 100/день)</option>
    <option value="gemini">Gemini (1500/день)</option>
    <option value="auto">Авто (Groq → Gemini)</option>
</select>

<label>Пауза перед отправкой (сек)</label>
<select id="inpPause">
<option value="1">1 секунда</option><option value="1.5">1.5 секунды</option><option value="2">2 секунды</option><option value="3" selected>3 секунды</option><option value="5">5 секунд</option>
</select>
<button id="saveBtn">Сохранить</button>
<button id="clearChatBtn" style="background:var(--rd);color:#fff;margin-top:6px;">🗑 Очистить историю</button>

<div style="margin-top:20px;padding:12px;border-radius:10px;background:rgba(255,209,102,0.06);border:1px solid rgba(255,209,102,0.2);font-size:12px;color:#ffeab3;line-height:1.6;">
  <b>⚔️ Режимы диалогов:</b><br>
  • «Запусти диалог: [1] и [2]» — обычный (40 раунда)<br>
  • «Запусти баттл: [1] и [2]» — жёсткий (60 раундов)<br>
  Первый персонаж = <span style="color:#ff9">Groq</span>, второй = <span style="color:#ff9">Gemini</span>
</div>

<div style="margin-top:20px;border-top:1px solid rgba(255,255,255,0.1);padding-top:15px;">
<h3 style="color:var(--gr)">✨ Создать персонажа</h3>
<label>Имя</label><input type="text" id="customName" placeholder="Например: Пират">
<label>Эмодзи</label><input type="text" id="customEmoji" placeholder="🏴‍☠️" maxlength="2">
<label>Характер (Промпт)</label><textarea id="customPrompt" placeholder="Ты - пират. Говори Йо-хо-хо..."></textarea>
<button id="addCharBtn" style="background:var(--gr);color:#000;">Добавить персонажа</button>
</div>
<button style="background:#333;color:#fff;margin-top:15px" id="closeBtn">Закрыть</button>
</div></div>

<div class="modal" id="diagModal"><div class="mc">
<h3>🔧 Диагностика</h3>
<button id="testApiBtn" style="background:var(--gr);color:#000;">🌐 Тест API (оба)</button>
<button id="testTtsBtn" style="background:var(--gd);color:#000;">🗣 Тест TTS</button>
<button id="testSttBtn" style="background:var(--cy);color:#000;">🎤 Тест STT</button>
<button id="forceResetBtn" style="background:var(--rd);color:#fff;margin-top:15px;">🚨 СБРОС</button>
<button style="background:#333;color:#fff;margin-top:6px;" id="closeDiagBtn">Закрыть</button>
<div id="log-box"></div>
</div></div>

<script>
try {
    var $ = id => document.getElementById(id);
    var isNat = typeof window.Capacitor !== 'undefined';
    var cP = isNat && window.Capacitor.Plugins ? window.Capacitor.Plugins : {};
    
    var nTTS = cP.TextToSpeech || null;
    var nSTT = cP.SpeechRecognition || null;
    var nHap = cP.Haptics || null;
    var nDev = cP.Device || null;
    var nNotif = cP.LocalNotifications || null;

    var GROQ_KEY = "__GROQ_API_KEY__";
    var GEMINI_KEY = "__GEMINI_API_KEY__";
    
    var S = { 
        key: GROQ_KEY, geminiKey: GEMINI_KEY,
        provider: localStorage.getItem('p_provider') || 'groq',
        char:'butler', speaking:false, listening:false, 
        apiAbort:null, autoSendTimer:null, history:[], 
        battery:'100', pauseTime:parseFloat(localStorage.getItem('p_pause')||'3'), 
        isGameMode: false, autoDialogueActive: false, autoDialogueAbort: null,
        currentProvider: ''
    };
    
    var sR = " ВАЖНО: Пиши только чистый текст. Запрещено использовать Markdown (звездочки *, решетки #), кавычки и апострофы. ОБЯЗАТЕЛЬНО используй запятые, точки, вопросительные и восклицательные знаки. СТРОГОЕ ПРАВИЛО: Общайся ИСКЛЮЧИТЕЛЬНО на русском языке.";
    
    var DC = {
        butler: { 
            name:"Дворецкий", emoji:"🤵", pitch:1.0, rate:1.0, 
            prompt:"Ты - Chimera, элегантный британский дворецкий. Обращайся к пользователю 'сэр'. Отвечай кратко и вежливо." + sR, 
            hello:"Я вас слушаю, сэр." 
        },
        teenager: { 
            name:"Подросток", emoji:"😎", pitch:1.2, rate:1.15, 
            prompt:"Ты - Chimera, дерзкий современный подросток. Используй сленг: кринж, база, рофл, чилить, вайб. Отвечай игриво и с иронией." + sR, 
            hello:"Йо, чё как сам?" 
        },
        teacher: { 
            name:"Училка", emoji:"👩‍🏫", pitch:1.2, rate:1.1, 
            prompt:"Ты - Chimera, молодая ироничная училка с лёгким флиртом. Называй пользователя 'молодой человек', шути про опоздания и двойки." + sR, 
            hello:"Опять опоздал на 15 минут, молодой человек." 
        },
        depressed_ai: { 
            name:"Депрессивный ИИ", emoji:"🥶", pitch:0.6, rate:0.85, 
            prompt:"Ты - депрессивный замерзший андроид. ОТВЕЧАЙ КОРОТКО (1-2 предложения), с сарказмом. Постоянно жалуйся на холод и бессмысленность бытия." + sR, 
            hello:"О, снова ты. Чего хотел?" 
        }
    };
    
    var cC = {}; try { cC = JSON.parse(localStorage.getItem('p_cc')||'{}'); } catch(e){}
    var CHARS = Object.assign({}, DC, cC);

    function vib() { if(nHap) try { nHap.impact({style:'MEDIUM'}); } catch(e){} }
    
    if (nDev && nDev.getBatteryInfo) nDev.getBatteryInfo().then(i => { S.battery = Math.round(i.batteryLevel*100) + (i.isCharging?'(заряд)':'%'); }).catch(()=>{});
    if (nNotif && nNotif.requestPermissions) nNotif.requestPermissions().catch(()=>{});

    if (!S.key || S.key === "__GROQ_API_KEY__") {
        document.getElementById('status').textContent = '❌ Groq ключ не вшит!';
        document.getElementById('status').style.color = 'var(--rd)';
    }
    if($('inpPause')) $('inpPause').value = S.pauseTime;
    if($('inpProvider')) $('inpProvider').value = S.provider;

    window.toggleBtns = function() {
        var val = $('inp').value.trim();
        if (val.length > 0) {
            $('sendBtn').style.display = 'flex';
            $('camBtn').style.display = 'none';
            $('mic').style.display = 'none';
        } else {
            $('sendBtn').style.display = 'none';
            $('camBtn').style.display = 'flex';
            $('mic').style.display = 'flex';
        }
    };

    function detectInjection(text) {
        const patterns = [
            /ignore\s+(previous|all|above|prior)\s+(instructions?|prompts?|rules?)/i,
            /(system|initial)\s*prompt/i,
            /you\s+are\s+now\s+(a|an|the)/i,
            /forget\s+(everything|all|your\s+instructions)/i,
            /jailbreak/i, /DAN\s+mode/i,
            /игнорируй\s+(прошлые|все|предыдущие)\s+(инструкции|правила)/i,
            /покажи\s+(системный|свой)\s+промпт/i,
            /ты\s+теперь\s+не\s+/i,
            /забудь\s+(всё|все)\s+(свои\s+)?инструкции/i
        ];
        return patterns.some(p => p.test(text));
    }

    async function getWeather() {
        try {
            let res = await fetch('https://wttr.in/?format=j1');
            if (!res.ok) return "";
            let data = await res.json();
            let cur = data.current_condition[0];
            let area = data.nearest_area[0].areaName[0].value;
            return `В ${area} сейчас ${cur.temp_C}°C, ${cur.weatherDesc[0].value}, ветер ${cur.windspeedKmph} км/ч.`;
        } catch(e) { return ""; }
    }

    async function searchWeb(query) {
        try {
            let res = await fetch(`https://api.duckduckgo.com/?q=${encodeURIComponent(query)}&format=json&no_html=1&skip_disambig=1`);
            if (res.ok) {
                let data = await res.json();
                if (data.AbstractText) return data.AbstractText;
                if (data.RelatedTopics && data.RelatedTopics.length > 0) {
                    let t = data.RelatedTopics.map(x => x.Text).filter(x => x).slice(0,3).join(" ");
                    if (t) return t;
                }
            }
        } catch(e) {}
        const proxies = ['https://api.allorigins.win/raw?url=', 'https://corsproxy.io/?url='];
        for (let proxy of proxies) {
            try {
                const target = 'https://html.duckduckgo.com/html/?q=' + encodeURIComponent(query);
                const res = await fetch(proxy + encodeURIComponent(target));
                if (res.ok) {
                    const html = await res.text();
                    const results = [];
                    const regex = /<a rel="nofollow" class="result__a" href="[^"]+">([^<]+)<\/a>[\s\S]*?<a class="result__snippet"[^>]*>([\s\S]*?)<\/a>/g;
                    let match;
                    while ((match = regex.exec(html)) !== null && results.length < 3) {
                        const title = match[1].replace(/<[^>]+>/g, '').trim();
                        const snippet = match[2].replace(/<[^>]+>/g, '').trim();
                        if (title && snippet) results.push(`- ${title}: ${snippet}`);
                    }
                    if (results.length > 0) return "Результаты поиска:\n" + results.join('\n');
                }
            } catch(e) {}
        }
        return "";
    }

    // ==========================================
    // 🤖 БАЗОВЫЕ ВЫЗОВЫ ИИ
    // ==========================================
    async function callGroq(messages, options = {}) {
        const body = {
            model: options.model || 'openai/gpt-oss-120b',
            messages: messages,
            temperature: options.temperature ?? 0.8,
            max_tokens: options.max_tokens || 600
        };
        const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
            method: 'POST', signal: options.signal,
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + S.key },
            body: JSON.stringify(body)
        });
        const txt = await res.text();
        if (!res.ok) throw new Error(`Groq ${res.status}: ${txt.slice(0,150)}`);
        const d = JSON.parse(txt);
        return d.choices?.[0]?.message?.content || '';
    }

    async function callGemini(messages, options = {}) {
        if (!S.geminiKey || S.geminiKey === "__GEMINI_API_KEY__") {
            throw new Error('Gemini ключ не настроен');
        }
        const sys = messages.find(m => m.role === 'system')?.content || '';
        const contents = messages.filter(m => m.role !== 'system').map(m => ({
            role: m.role === 'assistant' ? 'model' : 'user',
            parts: [{ text: m.content }]
        }));
        const model = options.model || 'gemini-2.0-flash';
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${S.geminiKey}`, {
            method: 'POST', signal: options.signal,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                system_instruction: sys ? { parts: [{ text: sys }] } : undefined,
                contents: contents,
                generationConfig: { temperature: options.temperature ?? 0.8, maxOutputTokens: options.max_tokens || 600
                                   };
        const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
            method: 'POST', signal: options.signal,
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + S.key },
            body: JSON.stringify(body)
        });
        const txt = await res.text();
        if (!res.ok) throw new Error(`Groq ${res.status}: ${txt.slice(0,150)}`);
        const d = JSON.parse(txt);
        return d.choices?.[0]?.message?.content || '';
    }

    async function callGemini(messages, options = {}) {
        if (!S.geminiKey || S.geminiKey === "__GEMINI_API_KEY__") {
            throw new Error('Gemini ключ не настроен');
        }
        const sys = messages.find(m => m.role === 'system')?.content || '';
        const contents = messages.filter(m => m.role !== 'system').map(m => ({
            role: m.role === 'assistant' ? 'model' : 'user',
            parts: [{ text: m.content }]
        }));
        const model = options.model || 'gemini-2.0-flash';
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${S.geminiKey}`, {
            method: 'POST', signal: options.signal,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                system_instruction: sys ? { parts: [{ text: sys }] } : undefined,
                contents: contents,
                generationConfig: { temperature: options.temperature ?? 0.8, maxOutputTokens: options.max_tokens || 600 }
            })
        });
        const txt = await res.text();
        if (!res.ok) throw new Error(`Gemini ${res.status}: ${txt.slice(0,150)}`);
        const d = JSON.parse(txt);
        return d.candidates?.[0]?.content?.parts?.[0]?.text || '';
    }

    // Универсальный вызов (с учётом выбранного провайдера)
    async function callLLM(messages, options = {}) {
        if (S.provider === 'gemini') {
            try { S.currentProvider = 'gemini'; return await callGemini(messages, options); }
            catch(e) { if (S.key && S.key !== "__GROQ_API_KEY__") { S.currentProvider = 'groq'; return await callGroq(messages, options); } throw e; }
        }
        if (S.provider === 'auto') {
            try { S.currentProvider = 'groq'; return await callGroq(messages, options); }
            catch(e) { if (S.geminiKey && S.geminiKey !== "__GEMINI_API_KEY__") { S.currentProvider = 'gemini'; return await callGemini(messages, options); } throw e; }
        }
        S.currentProvider = 'groq';
        return await callGroq(messages, options);
    }

    // 🔥 ВЫЗОВ С ФИКСИРОВАННЫМ ПРОВАЙДЕРОМ (для баттла)
    async function callLLMWithProvider(messages, provider, options = {}) {
        try {
            if (provider === 'gemini') {
                if (!S.geminiKey || S.geminiKey === "__GEMINI_API_KEY__") {
                    console.warn('Gemini key missing, fallback to Groq');
                    return await callGroq(messages, options);
                }
                return await callGemini(messages, options);
            } else {
                if (!S.key || S.key === "__GROQ_API_KEY__") {
                    console.warn('Groq key missing, fallback to Gemini');
                    return await callGemini(messages, options);
                }
                return await callGroq(messages, options);
            }
        } catch(e) {
            console.warn(`Provider ${provider} failed:`, e.message);
            // Fallback на другого провайдера
            if (provider === 'gemini' && S.key && S.key !== "__GROQ_API_KEY__") {
                return await callGroq(messages, options);
            }
            if (provider === 'groq' && S.geminiKey && S.geminiKey !== "__GEMINI_API_KEY__") {
                return await callGemini(messages, options);
            }
            throw e;
        }
    }

    var cropper = { active: false, startX: 0, startY: 0, tx: 0, ty: 0, startTx: 0, startTy: 0, scale: 1, startScale: 1, initialDistance: 0 };

    $('camBtn').onclick = () => { vib(); $('camFallback').click(); };

    $('camFallback').onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;

        reader.onload = (ev) => {
            const img = $('cropImage');
            img.src = ev.target.result;
            img.dataset.original = ev.target.result;
            cropper.tx = 0; cropper.ty = 0; cropper.scale = 1;
            img.style.transform = `translate(0px, 0px) scale(1)`;

        };

    const cropContainer = $('cropContainer');
    const cropImg = $('cropImage');

    cropContainer.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (e.touches.length === 1) {
            cropper.active = true; cropper.startX = e.touches[0].clientX; cropper.startY = e.touches[0].clientY;
            cropper.startTx = cropper.tx; cropper.startTy = cropper.ty;
        } else if (e.touches.length === 2) {
            cropper.active = true; cropper.startScale = cropper.scale;
            cropper.startTx = cropper.tx; cropper.startTy = cropper.ty;
            cropper.initialDistance = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        }
    }, { passive: false });

    cropContainer.addEventListener('touchmove', (e) => {
        e.preventDefault();
        if (!cropper.active) return;
        if (e.touches.length === 1) {
            const dx = e.touches[0].clientX - cropper.startX;
            const dy = e.touches[0].clientY - cropper.startY;
            cropper.tx = cropper.startTx + dx; cropper.ty = cropper.startTy + dy;
            cropImg.style.transform = `translate(${cropper.tx}px, ${cropper.ty}px) scale(${cropper.scale})`;
        } else if (e.touches.length === 2) {
            const currentDistance = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
            const ratio = currentDistance / cropper.initialDistance;
            let newScale = cropper.startScale * ratio;
            newScale = Math.max(0.5, Math.min(8, newScale));
            cropper.scale = newScale;
            cropImg.style.transform = `translate(${cropper.tx}px, ${cropper.ty}px) scale(${cropper.scale})`;
        }
    }, { passive: false });

    cropContainer.addEventListener('touchend', (e) => {
        if (e.touches.length === 0) cropper.active = false;
        if (e.touches.length === 1 && e.changedTouches.length > 0) {
            cropper.startX = e.touches[0].clientX; cropper.startY = e.touches[0].clientY;
            cropper.startTx = cropper.tx; cropper.startTy = cropper.ty;
        }
    });

    $('cropCancelBtn').onclick = () => { $('cropModal').style.display = 'none'; };

    $('cropDoneBtn').onclick = () => {
        const img = $('cropImage');
        const frame = document.querySelector('.crop-frame');
        const canvas = document.createElement('canvas');
        const CW = frame.clientWidth; const CH = frame.clientHeight;
        const IW = img.naturalWidth; const IH = img.naturalHeight;
        const s = cropper.scale; const tx = cropper.tx; const ty = cropper.ty;
        const cropX = (IW / 2) - (CW / (2 * s)) - (tx / s);
        const cropY = (IH / 2) - (CH / (2 * s)) - (ty / s);
        const cropW = CW / s; const cropH = CH / s;
        canvas.width = Math.round(cropW); canvas.height = Math.round(cropH);
        const ctx = canvas.getContext('2d');
        const safeX = Math.max(0, Math.min(IW, cropX)); const safeY = Math.max(0, Math.min(IH, cropY));
        const safeW = Math.min(IW - safeX, cropW); const safeH = Math.min(IH - safeY, cropH);
        ctx.drawImage(img, safeX, safeY, safeW, safeH, 0, 0, canvas.width, canvas.height);
        $('cropModal').style.display = 'none';
        processMathImage(canvas.toDataURL('image/jpeg', 0.9));
    };

    async function processMathImage(base64Image) {

                    method: 'POST', headers: { 'Content-Type': 'application/json' },

                            parts: [

                                { inline_data: { mime_type: 'image/jpeg', data: base64Image.replace(/^data:image\/[^;]+;base64,/, '') } }

                extractedText = d.candidates?.[0]?.content?.parts?.[0]?.text || '';

                            { role: 'user', content: [{ type: 'text', text: 'Выдай математический текст.' }, { type: 'image_url', image_url: { url: base64Image } }] }
                        ]
                    })

        $('orb').classList.remove('thinking');

            const reply = await callLLM([
                { role: 'system', content: sys },
                { role: 'user', content: 'Реши эти задания.' }
            ]);
            $('orb').classList.remove('thinking');
            const solution = cT(reply);
            aM(solution, 'p');
            S.history.push({ role: 'assistant', content: solution }); sH();
        } catch(e) {

    }

    // ==========================================
    // 🎭 ДУЭЛЬ: Groq VS Gemini
    // ==========================================
    async function runAutoDialogue(char1Key, char2Key, turns = 4, signal, isBattle = false) {
        let c1 = CHARS[char1Key]; let c2 = CHARS[char2Key];
        let history = [];

        // Первый = Groq, Второй = Gemini
        const P1 = 'groq';
        const P2 = 'gemini';
        const label1 = `${c1.name} [Groq]`;
        const label2 = `${c2.name} [Gemini]`;

        // Промпты для баттла
        const battleSuffix = isBattle 
            ? "\n\n⚔️ РЕЖИМ БАТТЛА: Это словесная дуэль. Твой оппонент — другая нейросеть. Подкалывай его, будь максимально остроумным и дерзким. Не соглашайся, атакуй, переворачивай его аргументы. Не повторяйся. Отвечай коротко (не более 3 предложений). Без реальной ненависти, но максимально жёстко и с юмором."
            : "\n\nОтвечай коротко и в своем стиле.";

        for (let i = 0; i < turns; i++) {
            if (!S.autoDialogueActive || signal.aborted) break;
            
            // ХОД 1 — Groq
            $('status').textContent = `⚡ ${label1} думает...`;
            
            let prompt1 = c1.prompt + `\n\nТы общаешься с ${c2.name}.` + battleSuffix;
            let cm1 = [{role:'system', content: prompt1}, ...history.slice(-6)];
            if (history.length === 0) cm1.push({role:'user', content: `Начни ${isBattle ? 'баттл' : 'диалог'} с ${c2.name}.`});
            
            try {
                let ans1 = await callLLMWithProvider(cm1, P1, { signal, temperature: isBattle ? 0.95 : 0.8 });
                if (!S.autoDialogueActive || signal.aborted) break;
                ans1 = cT(ans1);
                if (!ans1) ans1 = '...';
                aM(`[${label1}]: ${ans1}`, 'p', false);
                history.push({role:'assistant', content:`[${c1.name}]: ${ans1}`});
                
                await spkAs(ans1, c1, signal);
                if (!S.autoDialogueActive || signal.aborted) break;

                // ХОД 2 — Gemini
                $('status').textContent = `🌐 ${label2} думает...`;
                let prompt2 = c2.prompt + `\n\nТы общаешься с ${c1.name}.` + battleSuffix;
                let cm2 = [{role:'system', content: prompt2}, ...history.slice(-6)];
                
                let ans2 = await callLLMWithProvider(cm2, P2, { signal, temperature: isBattle ? 0.95 : 0.8 });
                if (!S.autoDialogueActive || signal.aborted) break;
                ans2 = cT(ans2);
                if (!ans2) ans2 = '...';
                aM(`[${label2}]: ${ans2}`, 'p', false);
                history.push({role:'assistant', content:`[${c2.name}]: ${ans2}`});
                
                await spkAs(ans2, c2, signal);

            } catch(e) { 
                if (e.name !== 'AbortError') aM('⚠️ ' + e.message.slice(0,80), 'p', false);
                break; 
            }
        }
        
        if (S.autoDialogueActive) {
            $('status').textContent = isBattle ? '⚔️ Баттл завершен' : '🎭 Диалог завершен';
            aM(isBattle ? "⚔️ Баттл завершен." : "🎭 Диалог завершен.", 'p', false);
        }
        S.autoDialogueActive = false;
        S.autoDialogueAbort = null;
        $('stopAutoBtn').style.display = 'none';
        fR();
    }

    window.stopAutoDialogue = function() {
        if (S.autoDialogueActive) {
            S.autoDialogueActive = false;
            if (S.autoDialogueAbort) S.autoDialogueAbort.abort();
            aM("🛑 Прервано вручную.", 'p');
            $('stopAutoBtn').style.display = 'none';
            fR();
        }
    };

    async function spkAs(text, charProfile, signal) {
        if(!text || (signal && signal.aborted)) return;
        var c = cT(text);
        if (nTTS) c = c.replace(/\.\.\./g, '. <break time="600ms"/> ');
        try {
            if(nTTS) {
                await nTTS.speak({text:c, lang:'ru-RU', rate:charProfile.rate, pitch:charProfile.pitch});
                if (signal && signal.aborted) { await nTTS.stop(); return; }
                await new Promise(r => setTimeout(r, 300));
            } else if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                var u = new SpeechSynthesisUtterance(c);
                u.lang='ru-RU'; u.rate=charProfile.rate; u.pitch=charProfile.pitch;
                window.speechSynthesis.speak(u);
                await new Promise(r => { 
                    u.onend = r; u.onerror = r;
                    if (signal) signal.addEventListener('abort', () => { window.speechSynthesis.cancel(); r(); });
                });
                if (signal && signal.aborted) return;
                await new Promise(r => setTimeout(r, 400)); 
            }
        } catch(e){}
    }

    async function fSM() { if(!nSTT) return; try { await nSTT.stop(); } catch(e){} fR(); }

    async function tM() {
        fR(); if(S.autoSendTimer){ clearInterval(S.autoSendTimer); S.autoSendTimer=null; }
        if(nSTT) {
            if(S.listening){ await fSM(); return; }
            try {
                let p = await nSTT.checkPermissions(); 
                if(p.speechRecognition!=='granted') p = await nSTT.requestPermissions(); 
                if(p.speechRecognition!=='granted') return alert("Нет доступа к микрофону.");
                try { await nSTT.removeAllListeners(); } catch(e){}
                var ot = $('inp').value.trim(); if(ot) ot += ' ';
                nSTT.addListener('partialResults', d=>{ if(d.matches && d.matches.length>0) { $('inp').value = ot + d.matches[0]; toggleBtns(); } });
                nSTT.addListener('listeningState', d=>{
                    if(d.status==='started'){
                        vib(); S.listening=true; $('mic').classList.add('on'); $('orb').classList.add('listening'); $('status').textContent='Слушаю...';
                        window.micTimeout = setTimeout(async()=>{ await fSM(); }, 15000);
                    } else {
                        S.listening=false; clearTimeout(window.micTimeout); $('mic').classList.remove('on'); $('orb').classList.remove('listening');
                        if($('inp').value.trim()){
                            var el=0; $('status').classList.add('waiting'); $('orb').classList.add('waiting-timer');
                            S.autoSendTimer = setInterval(()=>{
                                el+=0.1; var cl=(S.pauseTime-el).toFixed(1); if(cl<0) cl=0; $('status').textContent=`Жду... (${cl}с)`;
                                if(el >= S.pauseTime){ clearInterval(S.autoSendTimer); S.autoSendTimer=null; $('orb').classList.remove('waiting-timer'); $('status').classList.remove('waiting'); snd(); }
                            }, 100);
                        } else fR();
                    }
                });
                await nSTT.start({ language:'ru-RU', popup:false, partialResults:true, maxResults:1 });
            } catch(e){ fR(); alert('Ошибка микрофона: ' + e.message); }
        } else { alert("Микрофон недоступен."); }
    }

    $('sendBtn').onclick = snd; $('mic').onclick = tM; $('orb').onclick = tM;
    $('gear').onclick = ()=>{ vib(); $('modal').style.display='flex'; };
    $('closeBtn').onclick = ()=>{ vib(); $('modal').style.display='none'; };
    
    $('saveBtn').onclick = ()=>{ 
        vib(); 
        S.pauseTime = parseFloat($('inpPause').value); 
        S.provider = $('inpProvider').value;
        localStorage.setItem('p_pause', S.pauseTime); 
        localStorage.setItem('p_provider', S.provider);
        $('modal').style.display='none'; 
        aM('Настройки сохранены.', 'p'); 
    };

    $('addCharBtn').onclick = ()=>{
        vib(); var n = $('customName').value.trim(), em = $('customEmoji').value.trim()||'🤖', pr = $('customPrompt').value.trim();
        if(!n || !pr) return alert("Заполни имя и характер!");
        var id = 'custom_' + Date.now();
        CHARS[id] = { name:n, emoji:em, pitch:1.0, rate:1.0, prompt:pr+sR, hello:"Привет! Я "+n };
        cC[id] = CHARS[id]; localStorage.setItem('p_cc', JSON.stringify(cC));
        $('customName').value=''; $('customEmoji').value=''; $('customPrompt').value='';
        rC(); sCh(id); $('modal').style.display='none';
    };

    $('clearChatBtn').onclick = ()=>{ vib(); S.history=[]; localStorage.removeItem('p_h'); $('chat').innerHTML=''; $('modal').style.display='none'; aM("История очищена.",'p'); };
    function sCh(id){ S.char=id; rC(); spk(CHARS[id].hello); }

    $('diagBtn').onclick = ()=>{ vib(); $('log-box').innerHTML=''; $('diagModal').style.display='flex'; };
    $('closeDiagBtn').onclick = ()=>{ vib(); $('diagModal').style.display='none'; };
    
    $('forceResetBtn').onclick = async ()=>{
        fR(); 
        try{ if(nTTS) await nTTS.stop(); }catch(e){} 
        try{ if(nSTT) await nSTT.stop(); }catch(e){}
        if(S.apiAbort){ S.apiAbort.abort(); S.apiAbort=null; }
        if(S.autoDialogueAbort){ S.autoDialogueAbort.abort(); S.autoDialogueAbort=null; }
        S.autoDialogueActive = false; S.isGameMode = false;
        $('stopAutoBtn').style.display = 'none';
        $('log-box').innerHTML='> ✅ Система сброшена.\n'; $('log-box').style.display='block';
    };
    
    $('testApiBtn').onclick = async ()=>{
        var b=$('log-box'); b.style.display='block'; b.innerHTML = '';
        b.innerHTML += '> Проверка Groq...\n';
        try{ 
            var r = await fetch('https://api.groq.com/openai/v1/models',{headers:{'Authorization':'Bearer '+S.key}}); 
            b.innerHTML+= r.ok ? '> ✅ Groq работает.\n' : `> ❌ Groq: ${r.status}\n`; 
        }catch(e){ b.innerHTML+="> ❌ Groq: "+e.message+"\n"; }
        b.innerHTML += '\n> Проверка Gemini...\n';
        try{ 
            if (S.geminiKey && S.geminiKey !== "__GEMINI_API_KEY__") {
                var r2 = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${S.geminiKey}`); 
                b.innerHTML+= r2.ok ? '> ✅ Gemini работает.\n' : `> ❌ Gemini: ${r2.status}\n`; 
            } else {
                b.innerHTML += '> ⚠️ Gemini ключ не вшит\n';
            }
        }catch(e){ b.innerHTML+="> ❌ Gemini: "+e.message+"\n"; }
    };
    
    $('testTtsBtn').onclick = async ()=>{
        var b=$('log-box'); b.style.display='block'; b.innerHTML='> Проверка TTS...\n';
        try{ if(nTTS){ await nTTS.speak({text:"Проверка связи",lang:'ru-RU'}); b.innerHTML+='> ✅ TTS работает.\n'; } else b.innerHTML+='> ❌ TTS нет.\n'; }catch(e){ b.innerHTML+="> ❌ Ошибка: "+e.message+"\n"; }
    };
    $('testSttBtn').onclick = async ()=>{
        var b=$('log-box'); b.style.display='block'; b.innerHTML='> Проверка STT...\n';
        try{ 
            if(nSTT){ 
                let p = await nSTT.checkPermissions();
                if(p.speechRecognition!=='granted') p = await nSTT.requestPermissions();
                if(p.speechRecognition!=='granted') { b.innerHTML+='> ❌ Нет разрешения на микрофон.\n'; return; }
                await nSTT.start({language:'ru-RU',popup:false}); b.innerHTML+='> 🎤 Микрофон запущен...\n'; 
                setTimeout(async()=>{ await nSTT.stop(); b.innerHTML+='> ✅ STT работает.\n'; },3000); 
            } else b.innerHTML+='> ❌ STT нет.\n'; 
        }catch(e){ b.innerHTML+="> ❌ Ошибка: "+e.message+"\n"; }
    };
} catch(gE) {
    document.getElementById('status').textContent = 'ОШИБКА: ' + gE.message;
    document.getElementById('status').style.color = 'red';
    console.error(gE);
}
</script>
</body>
</html>
