name: Create APK
on:
  workflow_dispatch:
    inputs:
      appName:
        description: 'Название приложения'
        default: 'Chimera'
        required: true
      appVersion:
        description: 'Версия'
        default: '1.0.0'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          
      - name: Install dependencies
        run: npm install
        
      # 🔥 ВНЕДРЯЕМ ОБА КЛЮЧА
      - name: Inject API Keys
        run: |
          node -e "
            const fs = require('fs');
            const p = 'www/index.html';
            if (fs.existsSync(p)) {
              let h = fs.readFileSync(p, 'utf8');
              h = h.replace('__GROQ_API_KEY__', '${{ secrets.GROQ_API_KEY }}');
              h = h.replace('__GEMINI_API_KEY__', '${{ secrets.GEMINI_API_KEY }}');
              fs.writeFileSync(p, h);
              console.log('Keys injected successfully!');
            }
          "
        
      - name: Setup Capacitor
        run: |
          node -e "let c=require('./capacitor.config.json'); c.appName='${{ github.event.inputs.appName }}'; c.appId='com.chimera.app'; require('fs').writeFileSync('./capacitor.config.json', JSON.stringify(c, null, 2));"
        
      - name: Add Android
        run: npx cap add android
        
      - name: Generate Icons
        run: |
          mkdir -p resources
          if [ -f icon.png ]; then mv icon.png resources/icon.png; fi
          npx @capacitor/assets generate --android
          
      - name: Permissions
        run: |
          node -e "const fs=require('fs'); let p='android/app/src/main/AndroidManifest.xml'; let c=fs.readFileSync(p,'utf8'); let perms=['<uses-permission android:name=\"android.permission.RECORD_AUDIO\" />','<uses-permission android:name=\"android.permission.INTERNET\" />','<uses-permission android:name=\"android.permission.VIBRATE\" />','<uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\" />']; let m=perms.filter(x=>!c.includes(x)); if(m.length>0){ c=c.replace('<application',m.join('\n')+'\n<application'); fs.writeFileSync(p,c);}"
        
      - name: Sync Android
        run: npx cap sync android
        
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.appName }}-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
