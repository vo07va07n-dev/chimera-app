name: Create APK
on:
  workflow_dispatch:
    inputs:
      appName:
        description: 'Название приложения'
        required: true
        default: 'Chimera'
      appId:
        description: 'ID пакета'
        required: true
        default: 'com.chimera.app'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # 🔥 ВНЕДРЯЕМ КЛЮЧ ИЗ СЕКРЕТОВ GITHUB В HTML 🔥
      - name: Inject API Key
        run: |
          node -e "
            const fs = require('fs');
            const path = 'www/index.html';
            let html = fs.readFileSync(path, 'utf8');
            html = html.replace('__GROQ_API_KEY__', '${{ secrets.GROQ_API_KEY }}');
            fs.writeFileSync(path, html);
          "
          
      - name: Установка зависимостей
        run: npm install
        
      - name: Настройка Capacitor
        run: |
          node -e "let c=require('./capacitor.config.json'); c.appName='${{ github.event.inputs.appName }}'; c.appId='${{ github.event.inputs.appId }}'; require('fs').writeFileSync('./capacitor.config.json', JSON.stringify(c, null, 2));"
          
      - name: Генерация Android проекта
        run: npx cap add android

      - name: Применение кастомной иконки
        run: |
          mkdir -p resources
          if [ -f icon.png ]; then mv icon.png resources/icon.png; fi
          npx @capacitor/assets generate --android

      - name: Set dark navigation bar
        run: |
          sed -i 's/<style name="AppTheme.NoActionBarLaunch">/<style name="AppTheme.NoActionBarLaunch">\n        <item name="android:navigationBarColor">#05070d<\/item>\n        <item name="android:windowLightNavigationBar">false<\/item>/g' android/app/src/main/res/values/styles.xml

      - name: Внедрение разрешений
        run: |
          node -e "
            const fs = require('fs');
            const path = 'android/app/src/main/AndroidManifest.xml';
            let content = fs.readFileSync(path, 'utf8');
            const perms = [
                '<uses-permission android:name=\"android.permission.RECORD_AUDIO\" />',
                '<uses-permission android:name=\"android.permission.INTERNET\" />',
                '<uses-permission android:name=\"android.permission.VIBRATE\" />',
                '<uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\" />'
            ];
            let missing = perms.filter(p => !content.includes(p));
            if (missing.length > 0) {
                content = content.replace('<application', missing.join('\n    ') + '\n    <application');
                fs.writeFileSync(path, content);
            }
          "
          
      - name: Синхронизация
        run: npx cap sync android

      - name: Сборка APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          
      - name: Сохранение готового APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.appName }}-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
