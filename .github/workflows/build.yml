name: Create APK
on:
  workflow_dispatch:name: Create APK
on:
  workflow_dispatch:
    inputs:
      appName:
        description: 'Название приложения'
        required: true
        default: 'Chimera'
      appDescription:
        description: 'Описание'
        required: false
        default: 'Создано в моем конструкторе'
      appId:
        description: 'ID пакета'
        required: true
        default: 'com.chimera.app'
      appVersion:
        description: 'Версия'
        required: true
        default: '1.0.0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # 🚀 КЭШИРОВАНИЕ NPM (Ускоряет установку пакетов)
      - name: Cache NPM dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          
      - name: Установка зависимостей
        run: npm install

      # 🔥 ДОБАВЛЕННЫЙ ШАГ: ЗАХВАТ КЛЮЧА ИЗ СЕКРЕТОВ GITHUB 🔥
      - name: Inject API Key into HTML
        run: |
          node -e "
            const fs = require('fs');
            const path = 'www/index.html';
            if (fs.existsSync(path)) {
              let html = fs.readFileSync(path, 'utf8');
              // Заменяем заглушку на реальный ключ из секретов GitHub
              html = html.replace('__GROQ_API_KEY__', '${{ secrets.GROQ_API_KEY }}');
              fs.writeFileSync(path, html);
              console.log('API Key successfully injected!');
            } else {
              console.log('Error: www/index.html not found!');
            }
          "
          
      - name: Настройка Capacitor
        run: |
          node -e "let c=require('./capacitor.config.json'); c.appName='${{ github.event.inputs.appName }}'; c.appId='${{ github.event.inputs.appId }}'; require('fs').writeFileSync('./capacitor.config.json', JSON.stringify(c, null, 2));"
          
      - name: Генерация Android проекта
        run: npx cap add android

      # 🚀 КЭШИРОВАНИЕ GRADLE (Ускоряет сборку APK)
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Применение кастомной иконки из корня
        run: |
          mkdir -p resources
          if [ -f icon.png ]; then mv icon.png resources/icon.png; fi
          npx @capacitor/assets generate --android

      - name: Внедрение разрешений (TTS и Микрофон)
        run: |
          node -e "const fs=require('fs'); const p='android/app/src/main/AndroidManifest.xml'; let c=fs.readFileSync(p,'utf8'); if(!c.includes('RECORD_AUDIO')) { c=c.replace('<application', '<uses-permission android:name=\"android.permission.RECORD_AUDIO\" /> <uses-permission android:name=\"android.permission.INTERNET\" /> <queries><intent><action android:name=\"android.speech.RecognitionService\" /></intent><intent><action android:name=\"android.intent.action.TTS_SERVICE\" /></intent></queries> <application'); fs.writeFileSync(p,c); }"
          
      - name: Синхронизация
        run: npx cap sync android

      - name: Сборка APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          
      - name: Сохранение готового APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.appName }}-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
    inputs:
      appName:
        description: 'Название приложения'
        required: true
        default: 'Chimera'
      appVersion:
        description: 'Версия'
        required: true
        default: '1.0.0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Внедряем ключ через простую замену (самый надежный способ)
      - name: Inject API Key
        run: |
          if [ -f "www/index.html" ]; then
            sed -i 's/__GROQ_API_KEY__/${{ secrets.GROQ_API_KEY }}/g' www/index.html
          fi
          
      - name: Установка зависимостей
        run: npm install
        
      - name: Настройка Capacitor
        run: |
          node -e "let c=require('./capacitor.config.json'); c.appName='${{ github.event.inputs.appName }}'; c.appId='com.chimera.app'; require('fs').writeFileSync('./capacitor.config.json', JSON.stringify(c, null, 2));"
          
      - name: Генерация Android проекта
        run: npx cap add android

      - name: Обновление версии
        run: |
          node -e "
            const fs = require('fs');
            const path = 'android/app/build.gradle';
            let content = fs.readFileSync(path, 'utf8');
            content = content.replace(/versionName \".*\"/g, 'versionName \"${{ github.event.inputs.appVersion }}\"');
            fs.writeFileSync(path, content);
          "

      - name: Применение кастомной иконки
        run: |
          mkdir -p resources
          if [ -f icon.png ]; then mv icon.png resources/icon.png; fi
          npx @capacitor/assets generate --android

      - name: Темная навигация
        run: |
          sed -i 's/<style name="AppTheme.NoActionBarLaunch">/<style name="AppTheme.NoActionBarLaunch">\n        <item name="android:navigationBarColor">#05070d<\/item>\n        <item name="android:windowLightNavigationBar">false<\/item>/g' android/app/src/main/res/values/styles.xml

      - name: Внедрение разрешений
        run: |
          node -e "
            const fs = require('fs');
            const path = 'android/app/src/main/AndroidManifest.xml';
            let content = fs.readFileSync(path, 'utf8');
            const perms = [
                '<uses-permission android:name=\"android.permission.RECORD_AUDIO\" />',
                '<uses-permission android:name=\"android.permission.INTERNET\" />',
                '<uses-permission android:name=\"android.permission.VIBRATE\" />',
                '<uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\" />'
            ];
            let missing = perms.filter(p => !content.includes(p));
            if (missing.length > 0) {
                content = content.replace('<application', missing.join('\n    ') + '\n    <application');
                fs.writeFileSync(path, content);
            }
          "
          
      - name: Синхронизация
        run: npx cap sync android

      - name: Сборка APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          
      - name: Сохранение готового APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.appName }}-v${{ github.event.inputs.appVersion }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
